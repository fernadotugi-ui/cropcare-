<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropCare Enterprise | Product Manual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0d0e; color: #ececf1; }
        .sidebar { width: 320px; background-color: #1a1b1e; border-right: 1px solid #2d2e32; }
        .main-chat { background-color: #212226; flex: 1; display: flex; flex-direction: column; }
        .product-card { background: #2d2e32; border: 1px solid #3f3f46; transition: all 0.2s; }
        .product-card:hover { border-color: #10b981; }
        .info-bubble { background: #2d2e32; border: 1px solid #3f3f46; border-top-left-radius: 0; }
        .user-bubble { background: #065f46; border-top-right-radius: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="sidebar h-full hidden lg:flex flex-col p-6 overflow-y-auto">
        <div class="mb-8 border-b border-white/10 pb-4">
            <h1 class="text-white font-black tracking-tighter text-xl">CROPCARE</h1>
            <p class="text-[10px] text-emerald-500 font-bold tracking-widest uppercase">Inventory Support System</p>
        </div>
        
        <h2 class="text-gray-500 font-bold text-[10px] uppercase mb-4 tracking-widest">Available Products</h2>
        <div class="space-y-3" id="inventory-list"></div>
    </aside>

    <!-- Main Content -->
    <main class="main-chat relative">
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 md:p-12 space-y-6">
            <div class="max-w-3xl mx-auto text-center py-10">
                <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white uppercase tracking-tight">Product Manual Assistant</h2>
                <p class="text-gray-400 text-sm mt-2">Search the technical database for dosage, rates, and target pests.</p>
            </div>
        </div>

        <!-- Search Input -->
        <div class="p-6 bg-[#212226]">
            <div class="max-w-3xl mx-auto relative">
                <input type="text" id="userInput" onkeypress="if(event.key==='Enter') getProductInfo()" 
                       placeholder="Enter product name (e.g., Acetakill, Masterline Tubers...)" 
                       class="w-full bg-[#2d2e32] p-5 rounded-2xl outline-none text-sm text-white border border-transparent focus:border-emerald-500 transition-all shadow-2xl">
                <button onclick="getProductInfo()" class="absolute right-4 top-4 text-emerald-500 hover:text-emerald-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const products = [
            {
                name: "Masterline Tubers",
                category: "Fertilizer",
                info: "Fortified with Silicon. Formulation: NPK 12:34:30 + TE + Bio-Stimulants.",
                usage: "Excellent for potatoes, cassava, onions, and carrots.",
                rate: "20-30mls per 20 liters of water.",
                benefits: "Enables tuber formation, expansion, and uniformity."
            },
            {
                name: "Imidakill 700 WDG",
                category: "Insecticide",
                info: "Active Ingredient: Imidacloprid 700 g/kg.",
                usage: "Controls aphids, thrips, and whiteflies on Roses.",
                rate: "3g per 20L of water (150g per Ha in 2000L).",
                safety: "Re-entry period: 12 hours."
            },
            {
                name: "Masterline NPK 17:17:17",
                category: "Fertilizer",
                info: "Blended with Zinc, Boron, and 12% Calcium Oxide.",
                usage: "Compound fertilizer for balanced crop growth.",
                rate: "Manual application only; use no hooks.",
                size: "50kg Net Weight."
            },
            {
                name: "Masterline Potassium Nitrate",
                category: "Fertilizer",
                info: "NPK 13:0:46 Blended with Zinc, Boron, and Calcium Oxide.",
                usage: "100% Soluble agricultural fertilizer.",
                content: "Potassium 46%, Nitrogen 13%, Calcium Oxide 12%, Zinc 1%, Boron 0.6%.",
                size: "25kg Net Weight."
            },
            {
                name: "Jibucleaner 325 SC",
                category: "Fungicide",
                info: "Active: Azoxystrobin 200g/l + Difenoconazole 125g/l.",
                usage: "Controls Powdery Mildew, Blight, Rust, and Coffee Berry Disease.",
                rate: "Vegetables: 10-15ml per 20L pump. Tree crops: 15ml per 20L."
            },
            {
                name: "Acetakill 20SP",
                category: "Insecticide",
                info: "Active: Acetamiprid 200g/kg.",
                usage: "Controls Aphids, Thrips, and Whitefly nymphs.",
                rate: "5g per 20L of water (200g per Ha).",
                safety: "PHI (Pre-Harvest Interval): 7 Days for French beans."
            },
            {
                name: "Cropsil Liquid",
                category: "Miticide",
                info: "Organosilicone (830 g/L) sticker, spreader, and wetter.",
                usage: "Control of phytophagus mites (spider mites) on roses.",
                rate: "6.0 ml in 20 litres of water.",
                safety: "Re-entry period: One (1) day."
            }
        ];

        // UI Initialization
        const invList = document.getElementById('inventory-list');
        invList.innerHTML = products.map(p => `
            <div class="p-3 rounded-xl product-card cursor-pointer" onclick="fillInput('${p.name}')">
                <p class="text-[10px] font-bold text-emerald-500 uppercase">${p.category}</p>
                <p class="text-xs font-semibold text-white">${p.name}</p>
            </div>
        `).join('');

        function fillInput(name) { 
            document.getElementById('userInput').value = name;
            getProductInfo();
        }

        function getProductInfo() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat-window');
            const query = input.value.toLowerCase();
            if(!query) return;

            chat.innerHTML += `<div class="max-w-2xl ml-auto mb-4"><div class="user-bubble p-4 text-sm text-white rounded-2xl shadow-lg">${input.value}</div></div>`;
            
            let response = "No technical data found for this entry. Please select a product from the sidebar list.";

            const p = products.find(prod => query.includes(prod.name.toLowerCase().split(' ')[0]));
            if(p) {
                response = `
                    <div class="space-y-4">
                        <h3 class="text-emerald-400 font-bold text-lg border-b border-white/10 pb-2">${p.name}</h3>
                        <p class="text-sm"><strong>Composition:</strong> ${p.info}</p>
                        <p class="text-sm"><strong>Application:</strong> ${p.usage}</p>
                        <div class="bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20">
                            <p class="text-xs font-bold text-emerald-500 uppercase">Dosage Rate</p>
                            <p class="text-sm font-semibold">${p.rate || 'Check label packaging'}</p>
                        </div>
                        ${p.safety ? `<p class="text-xs text-orange-400 font-medium">⚠️ Handling: ${p.safety}</p>` : ''}
                        ${p.size ? `<p class="text-xs text-gray-500">Standard Pack: ${p.size}</p>` : ''}
                    </div>`;
            }

            setTimeout(() => {
                chat.innerHTML += `<div class="max-w-2xl mr-auto mb-8"><div class="info-bubble p-6 text-sm text-gray-200 rounded-3xl shadow-xl leading-relaxed">${response}</div></div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 300);
            input.value = "";
        }
    </script>
</body>
</html>
